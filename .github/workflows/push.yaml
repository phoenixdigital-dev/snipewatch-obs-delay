name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    # Spike : le code RTMP repris d'OBS n'est pas au format clang-format du template.
    if: false
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          # Notes de version : avertissement « non signé » et installation manuelle, puis les empreintes.
          cat > ${{ github.workspace }}/CHECKSUMS.txt <<'NOTES'
          ### Install (Windows 10/11 64-bit, OBS Studio 31+)

          > **Not code-signed yet** (planned). Windows SmartScreen will show *"Windows protected your PC"* for the installer: **More info → Run anyway**. Check the file first: in PowerShell, `Get-FileHash <file>` must print the SHA-256 below. Prefer not to run an unsigned installer? Use the manual install.

          - **Installer**: close OBS, run `*-windows-x64-setup.exe` (admin rights), reopen OBS: **Tools → SnipeWatch Delay**.
          - **Manual (zip)**: close OBS, extract `*-windows-x64.zip`, copy the `snipewatch-obs-delay` folder into `C:\ProgramData\obs-studio\plugins\` (create `plugins` if needed) so that you get `...\plugins\snipewatch-obs-delay\bin\64bit\snipewatch-obs-delay.dll`, reopen OBS.

          ### Installation (français)

          > **Pas encore signé** (prévu). Windows SmartScreen affichera « Windows a protégé votre ordinateur » : **Informations complémentaires → Exécuter quand même**. Vérifie le fichier avant : dans PowerShell, `Get-FileHash <fichier>` doit afficher l'empreinte SHA-256 ci-dessous. Tu préfères ne pas lancer un installeur non signé ? Fais l'installation manuelle.

          - **Installeur** : ferme OBS, lance `*-windows-x64-setup.exe` (droits administrateur), rouvre OBS : **Outils → SnipeWatch Delay**.
          - **Manuel (zip)** : ferme OBS, extrais `*-windows-x64.zip`, copie le dossier `snipewatch-obs-delay` dans `C:\ProgramData\obs-studio\plugins\` (crée `plugins` s'il n'existe pas) pour obtenir `...\plugins\snipewatch-obs-delay\bin\64bit\snipewatch-obs-delay.dll`, rouvre OBS.

          Details / détails : [README](https://github.com/phoenixdigital-dev/snipewatch-obs-delay#install-windows)

          NOTES
          echo "### Checksums (SHA-256)" >> ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
